server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Docker DNS resolver — allows nginx to re-resolve hostnames at runtime
    # Uses Docker's embedded DNS (127.0.0.11) with a 10s cache TTL
    resolver 127.0.0.11 valid=10s;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (excluding API paths which are proxied)
    location ~* ^(?!/api)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend server container
    # This allows the client to use relative URLs (/api) which get proxied to the server
    # Using a variable forces nginx to resolve DNS at runtime (not at startup)
    #
    # $request_uri is required: when proxy_pass contains a variable, nginx cannot
    # map the location prefix and sends the URI written in the directive as-is.
    # `proxy_pass $backend_server/api;` therefore turned /api/news into GET /api
    # (404). $request_uri already carries the query string, so no $is_args$args.
    location /api {
        set $backend_server "http://server:5001";
        proxy_pass $backend_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Server-Sent Events stream.
    #
    # Must be its own location: nginx buffers proxied responses by default, and a
    # buffered event stream delivers nothing until the buffer fills or the
    # response ends — which for a stream is never. `proxy_read_timeout` is also
    # raised above nginx's 60s default, because the server sends a heartbeat only
    # every 25s and a slow tick plus jitter must not be read as a dead connection.
    location /api/slop-meter/stream {
        set $backend_server "http://server:5001";
        proxy_pass $backend_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Tell the browser not to reuse this connection for anything else.
        add_header X-Accel-Buffering "no" always;
    }

    # Admin panel is served on its own subdomain (e.g. admin.real.sensorcensor.xyz)
    # via the shared nginx (PersonalDevOps). No proxy needed here.
}

