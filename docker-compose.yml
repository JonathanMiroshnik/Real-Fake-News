# ============================================================
# docker-compose.yml — real.sensorcensor.xyz (production VPS)
# ============================================================
# Orchestration only. Every value comes from the root .env (see .env.example):
#   - ${VARS} are interpolated by Compose
#   - the server also receives .env as env_file (new vars need no compose edit)
# Precedence inside a container: environment: > env_file: > Dockerfile ENV
#
# Each service builds from ITS OWN directory (context: ./server, ./client,
# ./admin), so every app stays self-contained — it can be built, run and
# relocated on its own:  cd server && docker build -t rfnews-server .
#
# This repo is deployed alongside PersonalDevOps on the same VPS. The shared
# nginx (devops-nginx) routes real.sensorcensor.xyz to container "client" on
# port 80. That container's own nginx proxies /api to container "server".
#
# ⚠️ No ports are exposed to the host — all inter-container communication is
#    over the devops_shared Docker network.
# ⚠️ No version: field (deprecated since docker-compose v2).
# ⚠️ No HEALTHCHECK — the shared nginx handles failures gracefully.
# ============================================================

services:
  # -----------------------------
  # Backend API — Express/TypeScript
  # Listens on internal port 5001
  # -----------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - .env
    environment:
      PORT: '5001'
      NODE_ENV: production
      # Path INSIDE the container — never touches the host namespace.
      # The host directory is bind-mounted at /data by DATABASE_DIR below, so the
      # Container-side paths are fixed so the app never depends on the host
      # layout: DATABASE_PATH and IMAGES_PATH are both REQUIRED by the app and
      # pinned here. The host side of each mount is DATABASE_DIR / IMAGES_DIR.
      DATABASE_PATH: /data/database.db
      IMAGES_PATH: /images
      CLIENT_URL: ${CLIENT_URL:-https://real.sensorcensor.xyz}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Required secrets — `docker compose config` fails with these messages
      DEEPSEEK_API_KEY: '${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY missing - cp .env.example .env}'
      NEWSDATA_API_KEY: '${NEWSDATA_API_KEY:?NEWSDATA_API_KEY missing - cp .env.example .env}'
      RUNWARE_API_KEY: '${RUNWARE_API_KEY:?RUNWARE_API_KEY missing - cp .env.example .env}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:?ADMIN_PASSWORD missing - cp .env.example .env}'
      # Behaviour toggles
      RUNWARE_IMAGE_MODEL: ${RUNWARE_IMAGE_MODEL:-runware:z-image@turbo}
      ENABLE_SCHEDULED_JOBS: ${ENABLE_SCHEDULED_JOBS:-true}
      DEBUG_LOGS: ${DEBUG_LOGS:-false}
    volumes:
      # Both mount sources come from the root .env (no defaults on purpose, so
      # `docker compose up` stops instead of silently creating ./database).
      #
      # `:z` tells Docker to label the host path for container use on every
      # start. Without it, a directory under /home keeps its `user_home_t`
      # SELinux label and a container is refused write access even though the
      # host user is allowed (Fedora ships SELinux as Enforcing). `:z` is
      # idempotent and relabels recursively, so relative paths like
      # `DATABASE_DIR=./database` work as-is — the label, not the location, is
      # what matters.
      - '${DATABASE_DIR:?DATABASE_DIR missing - set the host database directory in .env}:/data:rw,z'
      # Generated images (originals + compressed copies). Usually the sibling of
      # DATABASE_DIR, but it may point at its own disk / quota.
      - '${IMAGES_DIR:?IMAGES_DIR missing - set the host images directory in .env}:/images:rw,z'
    restart: unless-stopped
    networks:
      - devops_shared

  # -----------------------------
  # Client Frontend — React SPA
  # Entry point for the shared nginx, listens on internal port 80
  # Routes: / → static files, /api/* → server:5001
  # VITE_* values are baked in at BUILD time (rebuild to change them)
  # -----------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_USE_RELATIVE_API: ${VITE_USE_RELATIVE_API:-true}
        VITE_BACKEND_DEV_MODE: ${VITE_BACKEND_DEV_MODE:-false}
        VITE_API_BASE_DEV: ${VITE_API_BASE_DEV:-http://localhost:5001}
        VITE_API_BASE_PROD: ${VITE_API_BASE_PROD:-http://server:5001}
        VITE_DEBUG_LOGS: ${VITE_DEBUG_LOGS:-false}
        VITE_SHOW_HOROSCOPES: ${VITE_SHOW_HOROSCOPES:-true}
        VITE_SHOW_RECIPES: ${VITE_SHOW_RECIPES:-true}
        VITE_ARTICLES_CACHE_EXPIRATION_MS: ${VITE_ARTICLES_CACHE_EXPIRATION_MS:-600000}
    container_name: client
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - devops_shared

  # -----------------------------
  # Admin Panel — React SPA
  # Serves on its own subdomain (e.g. admin.real.sensorcensor.xyz)
  # Listens on internal port 80
  # -----------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_USE_RELATIVE_API: ${VITE_USE_RELATIVE_API:-true}
        VITE_BACKEND_DEV_MODE: ${VITE_BACKEND_DEV_MODE:-false}
        VITE_API_BASE_DEV: ${VITE_API_BASE_DEV:-http://localhost:5001}
        VITE_API_BASE_PROD: ${VITE_API_BASE_PROD:-http://server:5001}
        VITE_FRONTEND_DEV_MODE: ${VITE_FRONTEND_DEV_MODE:-false}
        VITE_CLIENT_URL_DEV: ${VITE_CLIENT_URL_DEV:-http://localhost:5173}
        VITE_CLIENT_URL_PROD: ${VITE_CLIENT_URL_PROD:-https://real.sensorcensor.xyz}
    container_name: admin
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - devops_shared

networks:
  # Shared network owned by the PersonalDevOps stack on this VPS: its nginx
  # reaches container "client" by name. `external: true` means exactly one thing
  # — "it already exists, do NOT create it", and that is the only reason a bare
  # `docker compose -f docker-compose.yml up` complains about it. Create it once:
  #   npm run setup        (or: docker network create devops_shared)
  # The dev overlay (docker-compose.override.yml) redefines this network as a
  # local, auto-created one, so local `docker compose up` needs no preparation.
  devops_shared:
    external: true
