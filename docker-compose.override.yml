# ============================================================
# docker-compose.override.yml — LOCAL containerised development overlay
# ============================================================
# Compose merges this file into docker-compose.yml AUTOMATICALLY (the filename
# is special), so plain commands work with no flags:
#
#   docker compose up --build -d
#   docker compose logs -f server
#   docker compose down
#
# Production ignores it by naming the base file explicitly:
#   docker compose -f docker-compose.yml up -d
#
# What it adds:   host port mappings so you can open the apps in a browser
#                 a project-local network (Compose creates it, so no manual
#                 `docker network create devops_shared` is needed for dev)
# What it overrides: environment values that are only correct for local dev
#
# Secrets still come from the root .env (env_file: .env in the base file).
# The VITE_* values below are hardcoded on purpose: they describe "browser on
# this machine -> containers", which is never a production configuration.
# ============================================================

services:
  server:
    ports:
      - '5001:5001'
    environment:
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      # Safety: never run background jobs against real API keys while developing
      # (they fetch news and generate articles = real API cost).
      # To test jobs locally, comment this line out or run the server on the host
      # with ENABLE_SCHEDULED_JOBS=true in server/.env.
      ENABLE_SCHEDULED_JOBS: 'false'
      DEBUG_LOGS: ${DEBUG_LOGS:-true}

  # One-shot content seeder — `docker compose up` populates an empty dev
  # database and then exits (restart: "no"), so `docker compose up` yields a
  # site with content instead of an empty feed.
  #
  # Safe to leave in the stack: the seeder is idempotent, so every restart after
  # the first is a no-op that prints "already seeded".
  # To wipe and rewrite the seeded content:
  #   docker compose run --rm seed node --no-warnings dist/scripts/seedDevData.js --reset
  seed:
    build:
      # Same context as `server`, so Docker reuses the cached build layers and
      # the seed runs exactly the code the API runs (dist/, not src/).
      context: ./server
      dockerfile: Dockerfile
    container_name: seed
    command: ['node', '--no-warnings', 'dist/scripts/seedDevData.js']
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Same pinned container paths as the server: one database, one image dir.
      DATABASE_PATH: /data/database.db
      IMAGES_PATH: /images
      # The seeder needs no API keys and must not start the scheduler.
      ENABLE_SCHEDULED_JOBS: 'false'
      DEBUG_LOGS: ${DEBUG_LOGS:-true}
    volumes:
      # Identical mounts to `server` — a seed that wrote somewhere else would be
      # invisible to the API. The `:z` suffix must match too: same SELinux label,
      # same relabel pass, no two-service relabel churn.
      - '${DATABASE_DIR:?DATABASE_DIR missing - set the host database directory in .env}:/data:rw,z'
      - '${IMAGES_DIR:?IMAGES_DIR missing - set the host images directory in .env}:/images:rw,z'
    depends_on:
      - server
    restart: 'no'
    networks:
      - devops_shared

  client:
    ports:
      - '5173:80'
    build:
      args:
        # Browser -> http://localhost:5173 -> this container's nginx -> server:5001
        VITE_USE_RELATIVE_API: 'true'
        VITE_BACKEND_DEV_MODE: 'false'
        VITE_API_BASE_PROD: http://server:5001
        VITE_DEBUG_LOGS: 'true'
        VITE_SHOW_HOROSCOPES: 'true'
        VITE_SHOW_RECIPES: 'true'

  admin:
    ports:
      - '5174:80'
    build:
      args:
        # Same nginx-proxy trick as the client, so no hardcoded host/IPs and no
        # CORS: the browser talks to localhost:5174, nginx talks to server:5001
        VITE_USE_RELATIVE_API: 'true'
        VITE_BACKEND_DEV_MODE: 'false'
        VITE_API_BASE_PROD: http://server:5001
        VITE_FRONTEND_DEV_MODE: 'true'
        VITE_CLIENT_URL_DEV: http://localhost:5173
        VITE_CLIENT_URL_PROD: http://client:80

networks:
  # Dev never talks to the shared VPS nginx, so the same logical network
  # ("devops_shared", referenced by the services) is realised as a local one that
  # Compose creates and removes by itself — `docker compose up` therefore needs
  # no `docker network create` step. Production keeps external: true in the base
  # file, where the PersonalDevOps nginx owns the real network.
  devops_shared:
    external: false
    name: rfnews-dev
